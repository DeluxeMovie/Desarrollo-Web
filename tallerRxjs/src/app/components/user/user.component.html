<div class="card shadow-sm border-0">
    <div class="card-body d-flex align-items-center gap-4">
      <img [src]="user.image" alt="Avatar de {{ user.username }}" class="rounded-circle border" width="100">
      <div>
        <h2 class="card-title">{{ user.firstName }} {{ user.lastName }}</h2>
        <p class="card-text text-muted mb-1"><strong>Username:</strong> {{ user.username }}</p>
        <p class="card-text text-muted"><strong>Email:</strong> {{ user.email }}</p>
      </div>
    </div>
  </div>
